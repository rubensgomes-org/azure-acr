# ---------------------------------------------------------------------------
# Runs compile -> test -> check -> assemble as four independently red/green
# steps sharing one workspace and one Gradle daemon, so each finds the previous
# step's work UP-TO-DATE via <project>/.gradle.
#
# The assemble step exists because applicationJar and generateDotEnv hang off
# "tasks.build", not "check" (app/build.gradle.kts). Without it there is no
# app/build/libs/*-spring-boot.jar for the Dockerfile to copy and no ".env" for
# acr-build-deploy.yml to read the version from. build-verify.yml gets them too
# and ignores them; both are gitignored build outputs, so nothing is dirtied.
#
# Callers MUST run actions/checkout and .github/actions/setup-java-gradle
# first: this action only invokes ./gradlew, it installs nothing.
#
# It does not run "sonar" -- that blocks on the SonarCloud quality gate and
# belongs to build-verify.yml.
#
# @author Rubens Gomes
# ---------------------------------------------------------------------------
name: build
description: 'Runs the compile / test / check / assemble phases as four red/green steps.'

inputs:
  # settings.gradle.kts reads GITHUB_USER and GITHUB_TOKEN while EVALUATING
  # SETTINGS, to resolve "com.rubensgomes:gradle-catalog" from GitHub Packages.
  # Every ./gradlew call needs both; without them, an HTTP 401.
  #
  # They are inputs because a composite action cannot read "secrets", and they
  # are named PACKAGES_* because Actions reserves the "GITHUB_" prefix in
  # "env:". Each step exports the real names itself, which also keeps the token
  # off the command line. "required: true" is documentation -- the runner does
  # not enforce it here.
  packages-user:
    description: 'GitHub Packages username, exported to the build as GITHUB_USER.'
    required: true
  packages-token:
    description: 'GitHub Packages token, exported to the build as GITHUB_TOKEN.'
    required: true

  # Overrides the noisier settings in gradle.properties (console=verbose,
  # logging.level=info), and disables foojay auto-provisioning so a toolchain
  # mismatch fails in seconds instead of downloading a second ~200 MB JDK.
  gradle-args:
    description: 'Flags passed to every ./gradlew invocation. Word-split by bash, so unquoted.'
    required: false
    default: >-
      --console=plain
      -Dorg.gradle.logging.level=lifecycle
      -Porg.gradle.java.installations.auto-download=false

runs:
  using: composite
  steps:
    # Each step echoes its command so the phase is greppable in raw logs.
    #
    # "shell: bash" is required on composite run steps, and load-bearing:
    # $GRADLE_ARGS is expanded unquoted and needs bash word-splitting.
    #
    # No "--no-daemon": one daemon serves every step, and setup-gradle stops it
    # post-job. Env is set per step rather than inherited from the caller's job.

    - name: compile
      shell: bash
      env:
        PACKAGES_USER: ${{ inputs.packages-user }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
      run: |
        echo "=============================================================="
        echo " STEP: compile"
        echo " ./gradlew :app:classes :app:testClasses"
        echo "=============================================================="
        export GITHUB_USER="$PACKAGES_USER"
        export GITHUB_TOKEN="$PACKAGES_TOKEN"
        ./gradlew $GRADLE_ARGS :app:classes :app:testClasses
        # "classes", not "compileJava", so processResources runs here -- that is
        # where ReplaceTokens substitutes @artifactId@ into application.yml.
        # "testClasses" too: a broken test is a COMPILE failure, and belongs to
        # this step rather than surfacing as a confusing test failure later.

    - name: test
      shell: bash
      env:
        PACKAGES_USER: ${{ inputs.packages-user }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
      run: |
        echo "=============================================================="
        echo " STEP: test"
        echo " ./gradlew :app:test"
        echo "=============================================================="
        export GITHUB_USER="$PACKAGES_USER"
        export GITHUB_TOKEN="$PACKAGES_TOKEN"
        ./gradlew $GRADLE_ARGS :app:test
        # "test" is finalizedBy jacocoTestReport, so the XML report the coverage
        # gate and SonarCloud consume is produced here -- even when tests fail.

    - name: check
      shell: bash
      env:
        PACKAGES_USER: ${{ inputs.packages-user }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
      run: |
        echo "=============================================================="
        echo " STEP: check"
        echo " ./gradlew :app:check"
        echo "=============================================================="
        export GITHUB_USER="$PACKAGES_USER"
        export GITHUB_TOKEN="$PACKAGES_TOKEN"
        ./gradlew $GRADLE_ARGS :app:check
        # Adds only spotlessCheck and jacocoTestCoverageVerification (90% LINE
        # and 90% BRANCH). "test" is not re-run: nothing here mutates its
        # inputs, and compileJava does not depend on spotlessApply.

    - name: assemble
      shell: bash
      env:
        PACKAGES_USER: ${{ inputs.packages-user }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
      run: |
        echo "=============================================================="
        echo " STEP: assemble"
        echo " ./gradlew :app:build"
        echo "=============================================================="
        export GITHUB_USER="$PACKAGES_USER"
        export GITHUB_TOKEN="$PACKAGES_TOKEN"
        ./gradlew $GRADLE_ARGS :app:build
        # ":app:build" is assemble + check, and check is UP-TO-DATE from the
        # previous step. New work: bootJar, applicationJar (the
        # "-spring-boot.jar" copy the Dockerfile expects) and generateDotEnv.
