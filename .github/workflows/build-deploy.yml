# =============================================================================
# Build and Deploy to ACR
#
# Provisions the environment's Azure Container Registry via the `azure-iac`
# repo's `acr-create.yml` workflow when it does not exist. Then builds the
# application and its container image, pushes the image to the ACR, verifies
# the push, smoke-tests the image and purges the untagged manifests it
# orphaned.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Build and Deploy to ACR

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Image namespace, used as <environment>/<artifactId>:<tag>.'
        required: false
        default: dev
        type: choice
        options:
          - dev
          - lab
      tag:
        description: 'Image tag. Empty defaults to the application version (APP_VERSION in .env).'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  resolve-acr:
    name: Resolve the ACR registry name
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.resolve.outputs.acr_name }}
    steps:
      - id: resolve
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT_NAME" in
            dev) acr_name=crrgomesdev01 ;;
            lab) acr_name=crrgomeslab02 ;;
            *)
              echo "Unknown environment: '${ENVIRONMENT_NAME}'." >&2
              exit 1
              ;;
          esac
          echo "acr_name=${acr_name}" >> "$GITHUB_OUTPUT"
          echo "Resolved acr_name: ${acr_name}"

  check-acr:
    name: Check whether the ACR registry exists
    needs: resolve-acr
    runs-on: ubuntu-latest
    outputs:
      acr_exists: ${{ steps.check.outputs.acr_exists }}
    steps:
      - name: Sign in to Azure
        uses: rubensgomes-org/azure-workflows/.github/actions/azure-login@v0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Lists by name rather than `az acr show` so a missing registry is not
      # an error, while Azure CLI failures still fail the job.
      - name: Check whether the registry exists
        id: check
        env:
          ACR_NAME: ${{ needs.resolve-acr.outputs.acr_name }}
        run: |
          echo "=============================================================="
          echo " STEP: Check whether the registry exists"
          echo "=============================================================="
          set -euo pipefail
          count="$(az resource list \
            --name "$ACR_NAME" \
            --resource-type Microsoft.ContainerRegistry/registries \
            --query "length(@)" -o tsv)"
          acr_exists=false
          if [ "$count" -gt 0 ]; then
            acr_exists=true
          fi
          echo "acr_exists=${acr_exists}" >> "$GITHUB_OUTPUT"
          echo "Registry '${ACR_NAME}' exists: ${acr_exists}"

  create-acr:
    name: Create ACR registry
    needs: [resolve-acr, check-acr]
    if: ${{ needs.check-acr.outputs.acr_exists != 'true' }}
    uses: rubensgomes-org/azure-iac/.github/workflows/acr-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      acr_name: ${{ needs.resolve-acr.outputs.acr_name }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  build-push-image:
    name: Build and push image to ACR registry
    needs: [resolve-acr, create-acr]
    # Runs when create-acr is skipped because the registry exists.
    if: ${{ !failure() && !cancelled() }}
    uses: rubensgomes-org/azure-workflows/.github/workflows/acr-build-push-java.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      tag: ${{ inputs.tag }}
      registry-name: ${{ needs.resolve-acr.outputs.acr_name }}
      artifact-id: azure-acr
      java-version: '25'
      java-distribution: microsoft
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      packages-token: ${{ secrets.RUBENS_PAT_TOKEN }}
      azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
