# =============================================================================
# build-deploy
#
# Builds the application and its container image, pushes the image to an
# EXISTING Azure Container Registry, verifies the push, smoke-tests the image
# and purges the untagged manifests it orphaned.
#
# The EXISTING Azure Container Registry is expected to be provisioned using
# one of the workflows in the Terraform IaC `azure-iac` repo.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: build-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Image namespace, used as <environment>/<artifactId>:<tag>.'
        required: false
        default: dev
        type: choice
        options:
          - dev
          - lab
      tag:
        description: 'Image tag. Empty defaults to the application version (APP_VERSION in .env).'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      registry-name: ${{ steps.registry.outputs.registry-name }}
    steps:
      - name: Resolve the registry name
        id: registry
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the registry name"
          echo "=============================================================="
          set -euo pipefail
          case "${{ inputs.environment }}" in
            dev) echo "registry-name=crrgomesdev01" >> "$GITHUB_OUTPUT" ;;
            lab) echo "registry-name=crrgomeslab02" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: registry
    uses: rubensgomes-org/azure-workflows/.github/workflows/acr-build-push-java.yml@v0
    with:
      environment: ${{ inputs.environment }}
      tag: ${{ inputs.tag }}
      registry-name: ${{ needs.registry.outputs.registry-name }}
      artifact-id: azure-acr
      java-version: '25'
      java-distribution: microsoft
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      packages-token: ${{ secrets.RUBENS_PAT_TOKEN }}
      azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
