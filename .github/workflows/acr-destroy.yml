# =============================================================================
# Delete Repo and Destroy ACR
#
# DESTRUCTIVE. Deletes the app's ACR repository, then destroys the Azure
# Container Registry, and every image in it, by calling the reusable ACR
# Destroy workflow in the Terraform IaC `azure-iac` repo. The shared managed
# identity and the resource groups are left standing.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Delete Repo and Destroy ACR

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment holding the registry.'
        required: true
        type: choice
        options:
          - dev
          - lab
      confirm:
        description: >
          DESTROYS THE APP'S ACR REPOSITORY AND THE REGISTRY, WITH EVERY
          IMAGE, TAG AND MANIFEST IN IT. There is no recycle bin and no
          soft-delete. The managed identity and resource groups are NOT
          touched. Choose "Yes" to confirm.
        required: true
        type: choice
        default: "No"
        options:
          - "No"
          - "Yes"

permissions:
  contents: read

concurrency:
  group: acr-destroy
  cancel-in-progress: false

jobs:
  resolve-acr:
    name: Resolve the ACR registry name
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.resolve.outputs.acr_name }}
    steps:
      - id: resolve
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT_NAME" in
            dev) acr_name=crrgomesdev01 ;;
            lab) acr_name=crrgomeslab02 ;;
            *)
              echo "Unknown environment: '${ENVIRONMENT_NAME}'." >&2
              exit 1
              ;;
          esac
          echo "acr_name=${acr_name}" >> "$GITHUB_OUTPUT"
          echo "Resolved acr_name: ${acr_name}"

  delete-acr-repo:
    name: Delete ACR repository
    needs: resolve-acr
    if: ${{ inputs.confirm == 'Yes' }}
    uses: rubensgomes-org/azure-workflows/.github/workflows/acr-repo-delete.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      registry-name: ${{ needs.resolve-acr.outputs.acr_name }}
      artifact-id: azure-acr
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  destroy-acr:
    name: Destroy the ACR registry
    needs: [resolve-acr, delete-acr-repo]
    uses: rubensgomes-org/azure-iac/.github/workflows/acr-destroy.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      acr_name: ${{ needs.resolve-acr.outputs.acr_name }}
      confirm: ${{ inputs.confirm }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
