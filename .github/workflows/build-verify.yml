# =============================================================================
# Gradle Build and Verify
#
# Compiles, tests, checks and assembles the project. Runs on push or manual
# dispatch; the SonarCloud scan and quality gate run only when dispatched
# with run-sonar checked.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Gradle Build and Verify

on:
    push:
    workflow_dispatch:
        inputs:
            run-sonar:
                description: 'Run the SonarCloud analysis and quality gate.'
                required: false
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-verify:
        name: Run build, tests, and optional SonarCloud scan
        uses: rubensgomes-org/azure-workflows/.github/workflows/gradle-build-verify.yml@v0
        with:
            run-sonar: ${{ inputs.run-sonar == true }}
        secrets:
            # Classic PAT with read:packages, stored as the RUBENS_PAT_TOKEN
            # repository Actions secret.
            packages-token: ${{ secrets.RUBENS_PAT_TOKEN }}
            # Required only when dispatched with run-sonar checked.
            sonar-token: ${{ secrets.SONAR_TOKEN }}
