# ---------------------------------------------------------------------------
# Continuous verification for the azure-acr project.
#
# Runs the same gate a developer runs locally -- compile, test, check, sonar --
# through the committed Gradle wrapper so CI and a workstation execute
# byte-identical Gradle.
#
# MANUALLY TRIGGERED ONLY. It used to run on every push to "main", which meant
# a release paid for it twice: "./gradlew release" already runs
# runBuildTasks -> build -> check, and the release plugin's two pushes to main
# each started a run of this workflow on top of that. Dispatch it when a
# verdict is actually wanted -- notably for the SonarCloud analysis, which the
# release build does NOT perform ("sonar" is not part of "build").
#
# Two local composite actions do the work: .github/actions/setup-java-gradle
# installs the JDK and configures Gradle, .github/actions/build runs the
# compile/test/check phases. Split so a workflow can take the toolchain without
# the build. "sonar" stays here: it blocks on the SonarCloud quality gate, which
# is this workflow's whole purpose and not something a build action should impose
# on its callers. It shares the job's daemon and workspace, so it adds only
# sonarResolver + sonar.
#
# @author Rubens Gomes
# ---------------------------------------------------------------------------
name: build-verify

on:
  # Manual only -- nothing here starts on its own. Actions always dispatches
  # from the default branch's copy of this file.
  workflow_dispatch:

# Least privilege: the per-run token is used only by actions/checkout.
#
# Deliberately NOT "packages: read" -- it would not help. The artifacts live in
# rubensgomes-org/mvn-pkgs, a DIFFERENT repository, and the per-run token is
# scoped to this one. That gap is why a PAT is used instead (PACKAGES_TOKEN).
permissions:
  contents: read

# Serialize runs on a ref: two at once would push two analyses for the same
# SonarCloud project key, and the gate results could land out of order.
#
# cancel-in-progress is false so every commit gets a verdict, not just the
# newest. Set it true to trade that for faster feedback on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    name: build-verify
    runs-on: ubuntu-latest

    # sonar.qualitygate.wait=true makes the last step BLOCK on SonarCloud. If
    # that queue backs up the step waits rather than fails, so a ceiling keeps
    # a stuck run from burning hours.
    timeout-minutes: 30

    env:
      # Carriers for the credentials the build reads as GITHUB_USER and
      # GITHUB_TOKEN; Actions reserves the "GITHUB_" prefix, so each step
      # exports the real names into its own shell. Exporting from a variable
      # also keeps the token off the command line.
      #
      # Every ./gradlew call needs both -- settings.gradle.kts resolves the
      # shared version catalog from GitHub Packages while EVALUATING SETTINGS.
      # Missing them yields a warning and then an unexplained HTTP 401.
      #
      # NOTE: the build reads GITHUB_USER, not the GITHUB_ACTOR that Actions
      # provides for free. Do not rename it.
      PACKAGES_USER: ${{ github.actor }}
      PACKAGES_TOKEN: ${{ secrets.RUBENS_PAT_TOKEN }}

      # SONAR_TOKEN is an Organization Action Secret.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Overrides the noisier gradle.properties settings (console=verbose,
      # logging.level=info) and disables foojay auto-provisioning, so a
      # toolchain mismatch fails in seconds instead of downloading a second
      # ~200 MB JDK. Expect the runners' preinstalled Temurin to be listed as
      # detected-but-rejected in that error -- that is the vendor pin working.
      #
      # Expanded UNQUOTED, so it depends on bash word-splitting; zsh would pass
      # the whole string as one argument. Hence "shell: bash" below.
      #
      # The build action declares an identical default. It is passed anyway
      # so this stays the one place the flags are written down, and an edit
      # here cannot silently apply to sonar alone.
      GRADLE_ARGS: >-
        --console=plain
        -Dorg.gradle.logging.level=lifecycle
        -Porg.gradle.java.installations.auto-download=false

    steps:
      # fetch-depth: 0 because SonarCloud derives New Code detection, blame and
      # issue backdating from git history. A shallow clone silently degrades
      # the analysis rather than failing.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Both actions are referenced by PATH, so they are read from the
      # workspace the checkout above just populated -- which is why neither can
      # precede that checkout.
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      # compile -> test -> check, each still its own red/green step. Values are
      # passed explicitly rather than inherited from the job env: an action must
      # not assume anything about its caller, and "secrets" is not readable
      # inside one at all.
      - name: Build
        uses: ./.github/actions/build
        with:
          packages-user: ${{ env.PACKAGES_USER }}
          packages-token: ${{ env.PACKAGES_TOKEN }}
          gradle-args: ${{ env.GRADLE_ARGS }}

      # Echoes its command first so the phase is greppable in raw logs, like
      # the steps inside the action. No "--no-daemon": the daemon started there
      # is reused here, and setup-gradle stops it post-job.
      - name: sonar
        shell: bash
        run: |
          echo "=============================================================="
          echo " STEP: sonar"
          echo " ./gradlew :app:sonar"
          echo "=============================================================="
          export GITHUB_USER="$PACKAGES_USER"
          export GITHUB_TOKEN="$PACKAGES_TOKEN"
          ./gradlew $GRADLE_ARGS :app:sonar
          # "sonar" dependsOn "check", now UP-TO-DATE, so this only resolves the
          # scanner and uploads. sonar.qualitygate.wait=true then BLOCKS until
          # SonarCloud computes the gate and FAILS the job if it fails. That is
          # why sonar runs last.

# ---------------------------------------------------------------------------
# NOTE -- what a release does instead
#
# "net.researchgate.release" pushes two commits to main per release:
#
#   [Gradle Release Plugin] - pre tag commit:  '0.0.2'.
#   [Gradle Release Plugin] - new version commit: '0.0.3-SNAPSHOT'.
#
# Neither starts a run any more, and neither does the release tag. The release
# itself compiles and checks the code ("./gradlew release" runs runBuildTasks
# -> build -> check), so the only thing lost is the SonarCloud analysis -- run
# this workflow by hand on the released commit when that analysis is wanted.
# ---------------------------------------------------------------------------
