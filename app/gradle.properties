# WARNING: the artifactId below is hardcoded in two other places, neither of
# which can read this file. Changing it here means changing it in both:
#
#   Dockerfile                       the JAR_FILE path and the OCI image
#                                    labels. A stale value fails the build.
#   .github/workflows/*.yml          the "name:" of build-deploy and
#                                    repo-delete, which carry the artifact
#                                    in parentheses so the Actions sidebar says
#                                    what they act on. A workflow name is
#                                    evaluated before any job runs, so it
#                                    cannot read this file. A stale value still
#                                    runs -- it just labels a DESTRUCTIVE
#                                    workflow with the wrong artifact, which is
#                                    the failure worth catching here rather
#                                    than mid-dispatch.
artifactId=azure-acr
group=com.rubensgomes
description=Spring Boot demo that builds and publishes its container image to Azure Container Registry
title=Azure Container Registry Demo
mainClass=com.rubensgomes.azure.acr.App

# version must end in SNAPSHOT for release plugin to work due to bug reported at:
# https://stackoverflow.com/questions/79675543/gradle-release-plugin-not-merging-main-to-release
version=0.0.8-SNAPSHOT

